appId: ${APP_ID}
name: TC-00-03 The first screen shows a value read from the app's bundled content data
---
# Step 1 — open the app on the emulator: it opens without an error.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: content-title
    timeout: 120000
- assertNotVisible:
    text: ".*(Error|isn't responding|keeps stopping|has stopped).*"
- takeScreenshot: step-01-opened
# Step 2 — the first screen shows the value kept in src/content/app.json
# (CONTENT_TITLE is read from that file by scripts/test-acceptance.sh).
- assertVisible:
    id: content-title
    text: ${CONTENT_TITLE}
- takeScreenshot: step-02-content-value
