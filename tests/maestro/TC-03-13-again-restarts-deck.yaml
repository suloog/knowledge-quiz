appId: ${APP_ID}
name: TC-03-13 Again restarts the category with every card unseen
# Run by scripts/test-acceptance.sh alone, after it has written the saved 3+ deck with one card
# left as root (DEC-55, DEC-56). The device is set to Polish. The saved state after "again" (0 of
# 50 seen, a new order) is read back from the device by the script once the flow has run, and
# recorded as "TC-03-13 step 2 — …" in junit/release.xml.
tags:
  - saved-deck
---
# Step 1 — bring 3+ to its end card.
- runFlow: subflows/end-card.yaml
- assertVisible:
    id: again
    text: ${END_AGAIN}
- takeScreenshot: step-01-end-card
# Step 2 — touch "again": a question is shown, the deck at its first card (card-0), answer hidden.
- extendedWaitUntil:
    notVisible:
      id: end-card
    timeout: 1000
    optional: true
    label: the end card shown for 1 s
- tapOn:
    id: again
- assertVisible:
    id: card-0
- assertVisible:
    id: question
    text: .+
- assertNotVisible:
    id: answer
- assertNotVisible:
    id: end-card
- takeScreenshot: step-02-deck-started-over
