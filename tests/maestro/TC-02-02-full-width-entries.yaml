appId: ${APP_ID}
name: TC-02-02 Each category entry spans the full width of the screen
# CATEGORY_COUNT (scripts/test-acceptance.sh): how many categories the shipped content data holds —
# 3+ alone until US-01-03 and US-01-04 ship 4+ and 5+ (DEC-48).
---
# Step 1 — open the app: the category screen is shown.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: category-screen
    timeout: 120000
- takeScreenshot: step-01-category-screen
# Step 2 — compare each entry's width with the screen's. Maestro selects by a width fixed in the flow,
# not by one known only on the device: scripts/test-acceptance.sh compares each entry's bounds, read
# from the accessibility layer, with the screen's width (`wm size`) right after the flows, as the
# JUnit case "TC-02-02 step 2". Here: every shipped entry is on screen, captured for the report.
- evalScript: ${output.entry = 0}
- repeat:
    times: ${CATEGORY_COUNT}
    commands:
      - assertVisible:
          id: category-${output.entry}
      - evalScript: ${output.entry = output.entry + 1}
- takeScreenshot: step-02-full-width-entries
