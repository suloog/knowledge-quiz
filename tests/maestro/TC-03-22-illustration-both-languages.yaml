appId: ${APP_ID}
name: TC-03-22 A question shows the same illustration in both languages
# Run by scripts/test-acceptance.sh alone, on the device set to Polish, after it has written as root
# the saved 3+ deck with an illustrated question first and nothing seen — the release build has no
# app-state bridge to bring a question to the front (DEC-55) — and read it back (QUESTION_PL,
# QUESTION_EN and its picture's file, ILLUSTRATION). Step 2 switches to English with the language
# switch on the category screen (US-02-03, DEC-67). scripts/illustration-server.js (ILLUSTRATION_URL)
# looks for the picture on the screen, pixel for pixel — found in both languages, it is the same
# shipped file, with nothing drawn into it.
tags:
  - illustration
---
# Precondition — the app installed, its data cleared but for the saved deck: not cleared again here.
- launchApp
- extendedWaitUntil:
    visible:
      id: category-screen
    timeout: 120000
# Step 1 — open the illustrated question in Polish: the illustration is shown.
- tapOn:
    id: category-0
- assertVisible:
    id: question
    text: ${QUESTION_PL}
- assertVisible:
    id: illustration
- evalScript: ${output.polish = JSON.parse(http.get(ILLUSTRATION_URL + '/illustration/' + ILLUSTRATION + '/TC-03-22-step-01').body)}
- assertTrue:
    condition: ${output.polish.found}
    label: the picture is on the screen in Polish, pixel for pixel
- takeScreenshot: step-01-illustration-in-polish
# Step 2 — back on the category screen, switch to English and open the same question: the same
# illustration. Its answer was not revealed, so it is still the first unseen card of 3+ (DEC-38).
- back
- assertVisible:
    id: category-screen
- tapOn:
    id: language-en
- assertVisible:
    id: language-en
    checked: true
- tapOn:
    id: category-0
- assertVisible:
    id: question
    text: ${QUESTION_EN}
- assertVisible:
    id: illustration
- evalScript: ${output.english = JSON.parse(http.get(ILLUSTRATION_URL + '/illustration/' + ILLUSTRATION + '/TC-03-22-step-02').body)}
- assertTrue:
    condition: ${output.english.found}
    label: the same picture is on the screen in English, pixel for pixel
- takeScreenshot: step-02-same-illustration-in-english
