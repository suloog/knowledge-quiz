appId: ${APP_ID}
name: TC-02-13 A language switch keeps every deck's position
# Run by scripts/test-acceptance.sh with the device set to Polish (the test case's test data),
# given the 3+ deck's questions in Polish and English (PL_QUESTIONS, EN_QUESTIONS: JSON lists in
# the deck's order). The app state is the saved 3+ deck, read from the device as root through
# scripts/saved-deck-server.js (DECK_STATE_URL): the release build has no app-state bridge (DEC-55).
# What it read is kept as TC-02-13-step-0N.json beside the flow's evidence.
tags:
  - deck-state
---
# Precondition — the app installed, its data cleared: first launch on the category screen, Polish.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: category-screen
    timeout: 120000
- assertVisible:
    id: language-pl
    checked: true
# Step 1 — open 3+, reveal three answers, note the fourth question, go back: the category screen.
# Each card, and each answer, has been shown for 1 s before it is touched (MOD-03-F14, DEC-40); the
# waits run out (optional) after 1 s.
- tapOn:
    id: category-0
- assertVisible:
    id: card-0
- extendedWaitUntil:
    notVisible:
      id: question
    timeout: 1000
    optional: true
    label: card 1 shown for 1 s
- tapOn:
    id: card-0
- assertVisible:
    id: answer
    text: .+
- extendedWaitUntil:
    notVisible:
      id: answer
    timeout: 1000
    optional: true
    label: answer 1 shown for 1 s
- tapOn:
    id: card-0
- assertVisible:
    id: card-1
- extendedWaitUntil:
    notVisible:
      id: question
    timeout: 1000
    optional: true
    label: card 2 shown for 1 s
- tapOn:
    id: card-1
- assertVisible:
    id: answer
    text: .+
- extendedWaitUntil:
    notVisible:
      id: answer
    timeout: 1000
    optional: true
    label: answer 2 shown for 1 s
- tapOn:
    id: card-1
- assertVisible:
    id: card-2
- extendedWaitUntil:
    notVisible:
      id: question
    timeout: 1000
    optional: true
    label: card 3 shown for 1 s
- tapOn:
    id: card-2
- assertVisible:
    id: answer
    text: .+
- extendedWaitUntil:
    notVisible:
      id: answer
    timeout: 1000
    optional: true
    label: answer 3 shown for 1 s
- tapOn:
    id: card-2
- assertVisible:
    id: card-3
- assertNotVisible:
    id: answer
- copyTextFrom:
    id: question
- evalScript: ${output.fourth = JSON.parse(PL_QUESTIONS).indexOf(maestro.copiedText)}
- assertTrue:
    condition: ${output.fourth >= 0}
    label: the fourth question is one of the 3+ deck's Polish questions
- takeScreenshot: step-01-fourth-question
- back
- assertVisible:
    id: category-screen
- evalScript: ${output.before = http.get(DECK_STATE_URL + '/TC-02-13-step-01').body}
- assertTrue:
    condition: ${JSON.parse(output.before).seen == 3}
    label: the saved deck has three cards seen
- takeScreenshot: step-01-back-on-categories
# Step 2 — switch to English and open 3+: the noted fourth question, in English, answer hidden.
- tapOn:
    id: language-en
- assertVisible:
    id: language-en
    checked: true
- tapOn:
    id: category-0
- assertVisible:
    id: card-3
- copyTextFrom:
    id: question
- assertTrue:
    condition: ${maestro.copiedText == JSON.parse(EN_QUESTIONS)[output.fourth]}
    label: the fourth question, in English
- assertNotVisible:
    id: answer
- evalScript: ${output.after = http.get(DECK_STATE_URL + '/TC-02-13-step-02').body}
- assertTrue:
    condition: ${output.after == output.before}
    label: the saved deck is as it was before the switch
- takeScreenshot: step-02-fourth-question-in-english
