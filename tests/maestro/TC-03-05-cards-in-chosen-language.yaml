appId: ${APP_ID}
name: TC-03-05 Cards appear in the language chosen on the category screen
# Run by scripts/test-acceptance.sh with the device set to Polish (the `device-language` flows),
# given the 3+ deck's questions and answers in English (EN_QUESTIONS, EN_ANSWERS: JSON lists, in the
# deck's order). The language is chosen with the switch on the category screen (US-02-03).
tags:
  - device-language
---
# Precondition — the app installed, its data cleared: first launch on the category screen.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: category-screen
    timeout: 120000
# Step 1 — switch to English on the category screen and choose 3+: the question is in English.
- tapOn:
    id: language-en
- assertVisible:
    id: language-en
    checked: true
- tapOn:
    id: category-0
- assertVisible:
    id: question
    text: .+
- copyTextFrom:
    id: question
- evalScript: ${output.card = JSON.parse(EN_QUESTIONS).indexOf(maestro.copiedText)}
- assertTrue:
    condition: ${output.card >= 0}
    label: the question is in English
- takeScreenshot: step-01-question-in-english
# Step 2 — touch the card: the answer is that question's answer in English.
# The card has been shown for 1 s before it is touched: a touch within 0.5 s of the card being
# drawn is ignored (MOD-03-F14, DEC-40). The question stays on screen, so the wait runs out
# (optional) after 1 s.
- extendedWaitUntil:
    notVisible:
      id: question
    timeout: 1000
    optional: true
    label: the card shown for 1 s
- tapOn:
    id: card-.*
- assertVisible:
    id: answer
    text: .+
- copyTextFrom:
    id: answer
- assertTrue:
    condition: ${maestro.copiedText == JSON.parse(EN_ANSWERS)[output.card]}
    label: the answer is in English
- takeScreenshot: step-02-answer-in-english
