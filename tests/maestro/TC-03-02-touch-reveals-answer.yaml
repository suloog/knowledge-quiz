appId: ${APP_ID}
name: TC-03-02 Touching the card reveals the answer below a line, and the question stays
# Run by scripts/test-acceptance.sh on a device set to Polish, the test case's test data.
tags:
  - device-language
---
# Precondition — the app installed, its data cleared: first launch on the category screen.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: category-screen
    timeout: 120000
# Step 1 — choose 3+: a question is shown, without its answer.
- tapOn:
    id: category-0
- assertVisible:
    id: question
    text: .+
- assertNotVisible:
    id: answer
- copyTextFrom:
    id: question
- evalScript: ${output.question = maestro.copiedText}
- takeScreenshot: step-01-question
# Step 2 — touch the middle of the card: the answer appears below the question, a horizontal
# line between them, and the question is still there, unchanged.
- tapOn:
    id: card-0
- assertVisible:
    id: rule
    below:
      id: question
- assertVisible:
    id: answer
    text: .+
    below:
      id: rule
- copyTextFrom:
    id: question
- assertTrue:
    condition: ${maestro.copiedText == output.question}
    label: the question on screen is the one shown before the touch
- assertNotVisible:
    text: ".*(Error|isn't responding|keeps stopping|has stopped|nie odpowiada|zatrzymuje się|przestała działać).*"
- takeScreenshot: step-02-answer-below-question
