appId: ${APP_ID}
name: TC-02-01 Launch opens on the category screen listing 3+, 4+ and 5+ in that order
# CATEGORIES, CATEGORY_COUNT (scripts/test-acceptance.sh): the labels expected on screen, in order —
# "3+", "4+", "5+" as MOD-02-F02 names them, then any other label the shipped decks hold — as
# patterns (3\+), and how many.
---
# Step 1 — open the app: the category screen is shown.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: category-screen
    timeout: 120000
- assertNotVisible:
    text: ".*(Error|isn't responding|keeps stopping|has stopped).*"
- takeScreenshot: step-01-category-screen
# Step 2 — read the list: entry n (category-n, top to bottom) is the n-th expected label — 3+, 4+,
# 5+ — and no entry follows the last.
- evalScript: ${output.entry = 0}
- repeat:
    times: ${CATEGORY_COUNT}
    commands:
      - assertVisible:
          id: category-${output.entry}
          text: ${CATEGORIES.split(',')[output.entry]}
      - evalScript: ${output.entry = output.entry + 1}
- assertNotVisible:
    id: category-${CATEGORY_COUNT}
- takeScreenshot: step-02-categories-in-order
