name: Acceptance tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast gates first: a broken format, lint, type or unit test fails here in about a
  # minute, before the emulator job spends a quarter of an hour on a head that cannot pass.
  checks:
    name: Gates (format, lint, types, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Types
        run: yarn tsc

      - name: Unit tests
        run: yarn test

  acceptance:
    name: Acceptance tests (Android 12 emulator)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The emulator is x86_64: build the native code for that one ABI instead of all four,
      # for the debug build `expo run:android` makes and the release build the tests sign.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Restored here and saved at the end whatever the tests say, so a red run still warms
      # the next one (actions/cache alone saves only after a green job).
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('yarn.lock', 'app.json', 'plugins/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A booted Android 12 emulator kept as a snapshot: later runs resume it instead of a cold
      # boot. Made once per cache key, with nothing of the app on it. The image is the Automated
      # Test Device one (aosp_atd): Android 12 without the Google apps, lighter and faster to boot;
      # the app is offline and uses no Google services.
      - name: Restore the emulator snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31-aosp_atd-x86_64-v1

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: aosp_atd
          channel: canary # where the emulator runner finds the ATD images
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Emulator snapshot made for the cache."

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The emulator is booted here; the tests start the app on it with scripts/stack.sh, what
      # `yarn stack` (the README's start command) runs. Which tests run is the repository's
      # business: scripts/test-acceptance.sh.
      - name: Acceptance tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OG_RUN_DIR: test-results
        with:
          api-level: 31
          arch: x86_64
          target: aosp_atd
          channel: canary # where the emulator runner finds the ATD images
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: yarn test:acceptance

      - name: Save the Gradle cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('yarn.lock', 'app.json', 'plugins/**') }}

      - name: Upload the results the delivery loop reads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: og-test-results
          path: test-results/**/*.xml
          if-no-files-found: error

      - name: Upload the evidence (screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: test-results/
          if-no-files-found: ignore
